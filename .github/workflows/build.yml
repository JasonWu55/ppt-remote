name: Build GUI App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          cd gui-app
          pyinstaller --onefile --noconsole --name ppt-remote main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-windows
          path: gui-app/dist/ppt-remote.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          cd gui-app
          pyinstaller --onefile --noconsole --name ppt-remote main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-linux
          path: gui-app/dist/ppt-remote
