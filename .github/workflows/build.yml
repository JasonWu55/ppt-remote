name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ppt-remote-gateway
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          cd gui-app
          pyinstaller --onefile --noconsole --name ppt-remote main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-windows
          path: gui-app/dist/ppt-remote.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: |
          cd gui-app
          pyinstaller --onefile --noconsole --name ppt-remote main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-linux
          path: gui-app/dist/ppt-remote

  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .app bundle
        run: |
          cd gui-app
          pyinstaller --onedir --windowed --name ppt-remote main.py
      - name: Create DMG
        run: |
          hdiutil create \
            -volname "PPT Remote" \
            -srcfolder "gui-app/dist/ppt-remote.app" \
            -ov -format UDZO \
            "gui-app/dist/ppt-remote-macos-arm.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-macos-arm
          path: gui-app/dist/ppt-remote-macos-arm.dmg

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd gui-app
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .app bundle
        run: |
          cd gui-app
          pyinstaller --onedir --windowed --name ppt-remote main.py
      - name: Create DMG
        run: |
          hdiutil create \
            -volname "PPT Remote" \
            -srcfolder "gui-app/dist/ppt-remote.app" \
            -ov -format UDZO \
            "gui-app/dist/ppt-remote-macos-intel.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ppt-remote-macos-intel
          path: gui-app/dist/ppt-remote-macos-intel.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-gateway, build-windows, build-linux, build-macos-arm, build-macos-intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ppt-remote-windows
          path: dist/windows/
      - uses: actions/download-artifact@v4
        with:
          name: ppt-remote-linux
          path: dist/linux/
      - uses: actions/download-artifact@v4
        with:
          name: ppt-remote-macos-arm
          path: dist/macos-arm/
      - uses: actions/download-artifact@v4
        with:
          name: ppt-remote-macos-intel
          path: dist/macos-intel/
      - name: Prepare release assets
        run: |
          cp dist/windows/ppt-remote.exe                  dist/ppt-remote-windows.exe
          cp dist/linux/ppt-remote                        dist/ppt-remote-linux
          cp dist/macos-arm/ppt-remote-macos-arm.dmg      dist/ppt-remote-macos-arm.dmg
          cp dist/macos-intel/ppt-remote-macos-intel.dmg  dist/ppt-remote-macos-intel.dmg
          chmod +x dist/ppt-remote-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ppt-remote-windows.exe
            dist/ppt-remote-linux
            dist/ppt-remote-macos-arm.dmg
            dist/ppt-remote-macos-intel.dmg
          generate_release_notes: true
